<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>就活管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ── サイドバー ── -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🎯</span>
      <span class="logo-text">就活管理</span>
    </div>
    <ul class="nav-list" id="nav-list"></ul>
    <div class="sidebar-footer">
      <div id="sidebar-stats"></div>
    </div>
  </nav>

  <!-- ── メインエリア ── -->
  <div id="main-wrapper">
    <header id="top-header">
      <button id="sidebar-toggle" class="icon-btn" title="サイドバーを折りたたむ">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <h1 id="page-title">ダッシュボード</h1>
      <div class="header-actions" id="header-actions"></div>
    </header>
    <main id="page-container"></main>
  </div>

</div>

<!-- ── モーダル ── -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="Modal.handleOverlayClick(event)">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title"></h2>
      <button class="modal-close" onclick="Modal.close()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6"  x2="6" y2="18"/>
          <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body"  id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ── トースト ── -->
<div id="toast-container"></div>

<!-- ── スクリプト（依存順） ── -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/components/toast.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/companies.js"></script>
<script src="js/pages/es.js"></script>
<script src="js/pages/calendar.js"></script>
<script src="js/pages/analysis.js"></script>
<script src="js/pages/memo.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/pages/motiv.js"></script>
<script src="js/app.js"></script>
</body>
</html>
